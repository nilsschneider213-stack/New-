# Einstellungen für Netlify (kein Build nötig – die Seite besteht aus fertigen Dateien)
[build]
  publish = "."

# Skripte, Styles und Bilder immer auf Aktualität prüfen lassen, damit Änderungen
# (neue Fotos, Texte) sofort bei allen Besuchern ankommen. Netlify antwortet bei
# unveränderten Dateien mit "nicht geändert" – das bleibt trotzdem schnell.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Schriften ändern sich nie und dürfen lange gespeichert werden
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Grundlegende Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
